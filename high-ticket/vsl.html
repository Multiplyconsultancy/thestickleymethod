<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>The Training — The Stickley Method</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #fbfaf8;
      --panel:     #ffffff;
      --ink:       #111111;
      --navy:      #0a2540;
      --muted:     #6b6b6b;
      --border:    rgba(10,37,64,0.12);
      --gold:      #b8933b;
      --gold-grad: linear-gradient(135deg, #caa14a 0%, #9c7a2c 100%);
      --font-head: 'Barlow Condensed', sans-serif;
      --font-body: 'Barlow', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { text-decoration: none; color: inherit; }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(900px 480px at 50% -8%, rgba(184,147,59,0.10), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    #header {
      position: relative;
      z-index: 10;
      padding: 22px 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border);
      background: rgba(251,250,248,0.85);
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-canvas { width: 50px; height: 50px; display: block; flex-shrink: 0; }
    .logo-brand { display: flex; flex-direction: column; line-height: 1; }
    .logo-brand-top {
      font-family: var(--font-head); font-size: 0.9rem; font-weight: 800;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink);
    }
    .logo-brand-bot {
      font-family: var(--font-head); font-size: 0.74rem; font-weight: 600;
      letter-spacing: 0.18em; color: var(--muted); text-transform: uppercase;
    }

    main {
      position: relative;
      z-index: 5;
      flex: 1;
      padding: 56px 24px 80px;
    }
    .vsl-inner {
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
      animation: rise 0.9s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(26px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .eyebrow {
      font-family: var(--font-head);
      font-size: 0.82rem; font-weight: 700;
      letter-spacing: 0.28em; text-transform: uppercase;
      background: var(--gold-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 18px;
    }
    h1 {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: clamp(2rem, 5.5vw, 3.6rem);
      line-height: 1;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 12px;
    }
    h1 .gold {
      background: var(--gold-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .sub {
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      color: var(--muted);
      max-width: 540px;
      margin: 0 auto 36px;
    }
    .video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0b1422;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 36px 80px -34px rgba(10,37,64,0.45);
    }
    .video-frame iframe,
    .video-frame video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      object-fit: contain;
      background: #0b1422;
    }
    .video-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: rgba(255,255,255,0.4);
    }
    .video-placeholder svg { width: 64px; height: 64px; stroke: var(--gold); opacity: 0.85; }
    .video-placeholder span {
      font-family: var(--font-head);
      font-size: 0.85rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }
    .cta-wrap {
      margin-top: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--navy);
      color: #ffffff;
      font-family: var(--font-head);
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 18px 44px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s;
      box-shadow: 0 14px 36px -14px rgba(10,37,64,0.6);
    }
    .btn-primary:hover { transform: translateY(-2px); background: #0d2e4f; }
    .cta-note {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    /* ── Proof / social proof ──────────────────────────── */
    .proof {
      max-width: 1000px;
      width: 100%;
      margin: 80px auto 0;
    }
    .proof-head { text-align: center; margin-bottom: 34px; }
    .proof-eyebrow {
      font-family: var(--font-head);
      font-size: 0.8rem; font-weight: 700;
      letter-spacing: 0.26em; text-transform: uppercase;
      background: var(--gold-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    .proof-title {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: clamp(1.7rem, 5vw, 2.6rem);
      text-transform: uppercase;
      letter-spacing: 0.01em;
      color: var(--ink);
    }
    .proof-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .tf-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 50px -34px rgba(10,37,64,0.4);
    }
    .tf-imgs {
      display: grid;
      grid-template-columns: 1fr;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: var(--bg);
    }
    .tf-imgs.split { grid-template-columns: 1fr 1fr; }
    .tf-ph {
      position: relative;
      overflow: hidden;
      background: var(--panel);
    }
    .tf-ph + .tf-ph { border-left: 1px solid var(--border); }
    .tf-ph img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .tf-ph .tag {
      position: absolute;
      bottom: 8px;
      left: 8px;
      font-family: var(--font-head);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink);
      background: rgba(255,255,255,0.92);
      padding: 4px 10px;
      border-radius: 100px;
    }
    .qt-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 26px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
      box-shadow: 0 20px 50px -34px rgba(10,37,64,0.4);
    }
    .qt-stars { display: flex; gap: 3px; }
    .qt-stars svg { width: 16px; height: 16px; fill: var(--gold); }
    .qt-text { font-size: 0.96rem; color: var(--ink); line-height: 1.65; flex: 1; }
    .qt-person { display: flex; align-items: center; gap: 12px; }
    .qt-avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: linear-gradient(160deg, #fbf2dc, #ece0bf);
      flex-shrink: 0;
    }
    .qt-meta .n { font-weight: 700; font-size: 0.92rem; color: var(--ink); }
    .qt-meta .r { font-size: 0.82rem; color: var(--muted); }
    @media (max-width: 760px) {
      .proof-grid { grid-template-columns: 1fr; }
    }

    #footer-banner {
      position: relative;
      z-index: 10;
      border-top: 1px solid var(--border);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--panel);
    }
    .footer-canvas { width: 34px; height: 34px; display: block; }
    .footer-word {
      font-family: var(--font-head);
      font-size: 0.95rem; font-weight: 800;
      letter-spacing: 0.3em; text-transform: uppercase;
      background: var(--gold-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    @media (max-width: 600px) {
      #header { padding: 18px 18px; }
    }
  </style>
  <script src="/js/posthog.js"></script>
</head>
<body>

<header id="header">
  <a href="#" class="logo" aria-label="The Stickley Method">
    <canvas class="logo-canvas phoenix" width="200" height="200"></canvas>
    <span class="logo-brand">
      <span class="logo-brand-top">THE STICKLEY</span>
      <span class="logo-brand-bot">METHOD</span>
    </span>
  </a>
</header>

<main>
  <div class="vsl-inner">
    <p class="eyebrow">The Training</p>
    <h1>YOUR APPEARANCE <span class="gold">IS LEVERAGE</span></h1>
    <p class="sub">Watch the full video below to fully understand how your appearance and income are linked.</p>

    <div class="video-frame">
      <iframe
        src="https://player.vimeo.com/video/1197539326?h=13cb36ee09&badge=0&autopause=0&player_id=0&app_id=58479"
        frameborder="0"
        allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        title="1-on-1 Looksmaxxing"
      ></iframe>
    </div>

    <div class="cta-wrap">
      <a href="apply" class="btn-primary">Apply Now →</a>
      <p class="cta-note">Applications are reviewed personally.</p>
    </div>

    <section class="proof">
      <div class="proof-head">
        <p class="proof-eyebrow">Real Results</p>
        <h2 class="proof-title">Recent Transformations</h2>
      </div>
      <div class="proof-grid">
        <div class="tf-card">
          <div class="tf-imgs">
            <div class="tf-ph"><img src="transformation%201.png" alt="Client transformation 1"></div>
          </div>
        </div>
        <div class="tf-card">
          <div class="tf-imgs">
            <div class="tf-ph"><img src="transformation%202.png" alt="Client transformation 2"></div>
          </div>
        </div>
        <div class="tf-card">
          <div class="tf-imgs split">
            <div class="tf-ph"><img src="transformation%203%20before.png" alt="Before"></div>
            <div class="tf-ph"><img src="transformation%203%20after.png" alt="After"></div>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>

<footer id="footer-banner">
  <canvas class="footer-canvas phoenix-footer" width="200" height="200"></canvas>
  <span class="footer-word">The Stickley Method</span>
</footer>

<script src="https://player.vimeo.com/api/player.js"></script>
<script src="phoenix.js"></script>
</body>
</html>
