<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home | The Self-Mastery System</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/member/start/start.css">
</head>
<body>
<div class="topbar"></div>
<div class="shell">
  <aside class="rail"></aside>
  <main class="main"><div class="wrap" id="page"></div></main>
</div>
<nav class="tabbar"></nav>
<script src="/member/start/data/path.js"></script>
<script src="/member/start/start.js"></script>
<script>
(function () {
  S.boot('home');
  function pcard(p) {
    var open = !p.gated || S.ladderOpen();
    var done = p.lessons.filter(function (l) {
      return l.kind === 'day' ? S.done(l.day) : !!S.Store.get('intro.' + l.id, false);
    }).length;
    var tot = p.lessons.length;
    var pct = tot ? Math.round(done / tot * 100) : (open ? 100 : 0);
    var href = p.id === 'library' ? '/member/start/library' : '/member/start/phase?p=' + p.id;
    var sub = tot ? done + ' / ' + tot + ' lessons' : '24 builds';
    if (p.id === 'seven') sub += ' · ' + window.PATH.totalPrompts() + ' prompts';
    var inner =
      '<div class="pcard__top"><span class="chip">' + S.icon(p.mark) + '</span>' +
        '<span class="pcard__eyebrow">Phase ' + p.n + '</span>' +
        (open ? '' : '<span class="pcard__lock">' + S.icon('lock') + '</span>') + '</div>' +
      '<h3>' + S.esc(p.title) + '</h3><p>' + S.esc(p.blurb) + '</p>' +
      '<div class="pcard__foot"><span>' + sub + '</span><span class="pc">' + pct + '%</span></div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>';
    return (open ? '<a class="pcard" href="' + href + '"' : '<div class="pcard is-locked"') +
      ' style="--day:' + p.accent + '">' + inner + (open ? '</a>' : '</div>');
  }

  /* The hero's status line. Three states, because a member who has
     finished every module of a day needs to be told to submit, not
     handed a count of zero. */
  function metaFor(d, nDone) {
    var tot = d.parts.length, out;
    if (nDone >= tot)      out = '<span><b>All ' + tot + '</b> modules done</span><span>Ready to submit</span>';
    else if (nDone > 0)    out = '<span><b>' + nDone + ' of ' + tot + '</b> modules done</span><span><b>~' + Math.round(d.minutes * (tot - nDone) / tot) + '</b> min left</span>';
    else                   out = '<span><b>' + tot + '</b> modules</span><span><b>~' + d.minutes + '</b> min</span>';
    return out + '<span>' + S.esc(d.builds) + '</span>';
  }

  /* The week at a glance, so the home screen answers "where am I" without
     a second page. Only data we actually hold: done, open, or a countdown. */
  function sevenRows() {
    return P.days.map(function (dd) {
      var isDone = S.done(dd.n), open = S.unlocked(dd.n);
      var cls = isDone ? ' is-done' : (open ? ' is-now' : '');
      var st;
      if (isDone) st = 'Done';
      else if (open) st = S.partsDone(dd.n).length + '/' + dd.parts.length;
      else { var ms = S.openIn(dd.n); st = ms === null ? 'Locked' : S.shortLeft(ms); }
      var inner = '<span class="seven__n">' + (isDone ? S.icon('tick') : dd.n) + '</span>' +
        '<span class="seven__t">' + S.esc(dd.title) + '</span>' +
        '<span class="seven__s">' + st + '</span>';
      return open
        ? '<a class="seven__r' + cls + '" href="/member/start/day?d=' + dd.n + '">' + inner + '</a>'
        : '<div class="seven__r' + cls + '">' + inner + '</div>';
    }).join('');
  }

  var P = window.PATH, st = S.state();
  var totL = P.totalLessons();
  var introDone = !!S.Store.get('intro.welcome', false);
  var doneL = S.doneCount() + (introDone ? 1 : 0);
  var pct = Math.round(doneL / totL * 100);
  var cur = S.currentDay();
  var modsDone = P.days.reduce(function (t, d) { return t + S.partsDone(d.n).length; }, 0);

  var html = '<div class="phead"><h1>' + (st.startedAt ? 'Welcome back.' : 'Welcome in.') + '</h1>' +
    '<p class="sub">' + doneL + ' of ' + totL + ' lessons complete &middot; ' +
    S.activeDays() + '-day streak &middot; ' + modsDone + ' of ' + P.totalPrompts() + ' prompts sent</p></div>';

  /* ── One next action, above everything ── */
  if (!S.ladderOpen()) {
    if (!introDone && !S.doneCount()) {
      html += '<a class="now" style="--day:#E8825C" href="/member/start/phase?p=start">' +
        '<span class="label">Start here</span><h2>Watch the welcome</h2>' +
        '<p class="lede">Four minutes. What this is, how the week works, and exactly where to begin.</p>' +
        '<div class="now__meta"><span><b>4</b> min</span><span>Phase 1</span></div>' +
        '<div class="btn-row"><span class="btn btn--primary">Watch it &rarr;</span></div></a>';
    } else {
      var d = P.day(cur), waiting = !S.unlocked(cur) ? S.openIn(cur) : 0;
      var nDone = S.partsDone(cur).length;
      if (waiting > 0) {
        html += '<div class="now" style="--day:' + d.accent + '"><span class="label">Next up &middot; ' + S.esc(d.eyebrow) + '</span>' +
          '<h2>' + S.esc(d.title) + '</h2><p class="lede">' + S.esc(d.summary) + '</p>' +
          '<div class="cd" id="cd" style="max-width:340px;margin-top:18px"></div>' +
          '<p class="hint" style="margin-top:12px;color:var(--faint);font-size:13px">One day opens every ' +
          S.UNLOCK_HOURS + ' hours. A week of honest records cannot be crammed into one evening.</p></div>';
      } else {
        html += '<a class="now" style="--day:' + d.accent + '" href="/member/start/day?d=' + cur + '">' +
          '<span class="label">' + (nDone ? 'Continue' : 'Next up') + ' &middot; ' + S.esc(d.eyebrow) + '</span>' +
          '<h2>' + S.esc(d.title) + '</h2><p class="lede">' + S.esc(d.summary) + '</p>' +
          '<div class="now__meta">' + metaFor(d, nDone) + '</div>' +
          '<div class="btn-row"><span class="btn btn--primary">' + (nDone ? 'Continue' : 'Start') + ' &rarr;</span></div></a>';
      }
    }
  }

  /* ── Progress + activity ── */
  html += '<div class="toprow" style="margin-top:22px">' +
    '<div class="panel panel--progress"><h3>Course Progress</h3><p class="cap">All phases combined</p>' +
      S.ring(pct, 132, 'var(--gold)', pct + '%', doneL + ' / ' + totL) +
      '<div class="prail"><div><b>' + S.doneCount() + '</b><span>Days</span></div>' +
      '<div><b>' + modsDone + '</b><span>Modules</span></div>' +
      '<div><b>' + P.totalPrompts() + '</b><span>Prompts</span></div></div></div>' +

    '<div class="panel" style="position:relative"><h3>Activity</h3>' +
      '<p class="cap">' + S.activeDays() + ' active day' + (S.activeDays() === 1 ? '' : 's') + ' &middot; last 18 weeks</p>' +
      '<div class="streakbig"><b>' + S.activeDays() + '</b><span>Day streak</span></div>' +
      S.heatmap(18) +
      '<div class="heat__legend"><span>Less</span><i></i>' +
        '<i style="background:rgba(79,169,122,.34)"></i><i style="background:rgba(79,169,122,.64)"></i>' +
        '<i style="background:rgba(79,169,122,.94)"></i><span>More</span></div></div>' +

    '<div class="panel panel--seven"><h3>The Seven</h3>' +
      '<p class="cap">' + S.doneCount() + ' of 7 days closed</p>' +
      '<div class="seven">' + sevenRows() + '</div></div>' +
    '</div>';

  /* ── Modules ── */
  html += '<div class="sec"><div class="sec__head"><h2>Your modules</h2>' +
    '<a href="/member/start/modules">All phases &rsaquo;</a></div>' +
    '<p style="color:var(--faint);font-size:13px;margin:-6px 0 13px">Work through them in order.</p>' +
    '<div class="phases">' + P.phases.map(pcard).join('') + '</div></div>';

  /* ── What opens at seven ── */
  html += '<div class="sec"><div class="sec__head"><h2>What opens at seven</h2>' +
    '<a href="/member/start/bonus">Details &rsaquo;</a></div>';
  var op = S.ladderOpen();
  P.unlocks.forEach(function (u) {
    html += '<div class="lad' + (op ? ' is-open' : '') + '" style="--a:' + u.accent + '">' +
      '<span class="chip" style="--a:' + u.accent + '">' + S.icon(u.mark) + '</span>' +
      '<div><h3>' + S.esc(u.title) + '</h3><p>' + S.esc(u.sub) + '</p></div>' +
      '<span class="lad__s">' + S.icon(op ? 'tick' : 'lock') + '</span></div>';
  });
  html += '</div>';

  /* ── Included programmes ── */
  html += '<div class="sec"><div class="sec__head"><h2>Included with your membership</h2></div><div class="phases">';
  [{ t:'The Stickley Method', s:'Appearance', a:'#8B6FD4', m:'grid' },
   { t:'Nightfall', s:'Mind & Character', a:'#4A7FD4', m:'depth' },
   { t:'IMPACT', s:'Wealth', a:'#D9A441', m:'chart' }].forEach(function (x) {
    html += '<div class="pcard" style="--day:' + x.a + '">' +
      '<div class="pcard__top"><span class="chip">' + S.icon(x.m) + '</span>' +
      '<span class="pcard__eyebrow">Programme</span></div>' +
      '<h3>' + x.t + '</h3><p>Surfaced inside ' + x.s + '. Full programme included.</p>' +
      '<div class="pcard__foot"><span>Included</span><span class="pc">—</span></div></div>';
  });
  html += '</div></div>';

  document.getElementById('page').innerHTML = html;

  var cd = document.getElementById('cd');
  if (cd) S.tick(function () {
    var ms = S.openIn(cur);
    if (ms <= 0) { window.location.reload(); return; }
    cd.innerHTML = S.clockFace(ms).map(function (u) {
      return '<div><b>' + u.v + '</b><span>' + u.l + '</span></div>';
    }).join('');
  });
})();
</script></body></html>
