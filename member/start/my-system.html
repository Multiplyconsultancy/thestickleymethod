<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My System | The Self-Mastery System</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/member/start/start.css">
</head>
<body>
<div class="topbar"></div>
<div class="shell">
  <aside class="rail"></aside>
  <main class="main"><div class="wrap" id="page"></div></main>
</div>
<nav class="tabbar"></nav>
<script src="/member/start/data/path.js"></script>
<script src="/member/start/start.js"></script>
<script>
(function () {
  S.boot('system');
  var app = S.app();
  var page = document.getElementById('page');

  if (!app) {
    page.innerHTML = '<div class="head"><span class="label">My System</span><h1>Nothing built yet.</h1>' +
      '<p class="lede">Day One builds it. About forty-five minutes, six prompts, all copy and paste.</p></div>' +
      '<a class="btn btn--primary" href="/member/start/day?d=1">Start Day 1 &rarr;</a>';
    return;
  }

  /* What the app can do is derived from days finished, so this page
     visibly accumulates as the week goes on. That accumulation is the
     retention claim: this now contains my system. */
  var CAPS = [
    { d: 1, t: 'Five rooms', s: 'Body, Mind, Appearance, Character, Wealth — with your real numbers' },
    { d: 2, t: 'Daily promises', s: 'Five promises and a streak grid that goes honest when you miss' },
    { d: 3, t: 'Your Why', s: 'On the home screen, and quoted back at you when you go quiet' },
    { d: 4, t: 'Weekly Review', s: 'Compiles your week and tells you the date you land on at this pace' },
    { d: 5, t: 'The Coach', s: 'Messages you daily and writes the board from your reply' },
    { d: 6, t: 'One room in depth', s: 'The area actually holding you back, built out properly' },
  ];

  var html = '<div class="head"><span class="label">My System</span><h1>Your app</h1>' +
    '<p class="lede">Everything you have built this week lives in one place. Open it, and keep talking to it.</p></div>' +
    '<a class="btn btn--primary btn--block" href="' + S.esc(app.url) + '" target="_blank" rel="noopener">Open my system &#8599;</a>' +
    '<a class="appurl" href="' + S.esc(app.url) + '" target="_blank" rel="noopener">' + S.esc(app.url) + '</a>' +
    '<div class="btn-row"><button class="btn btn--sm btn--ghost" id="edit">Update link</button></div>';

  html += '<div class="sec"><div class="sec__head"><h2>What it does</h2></div>';
  CAPS.forEach(function (c) {
    var on = S.done(c.d);
    html += '<div class="lad' + (on ? ' is-open' : '') + '"><div><h3>' + S.esc(c.t) + '</h3>' +
      '<p>' + (on ? S.esc(c.s) : 'Added on Day ' + c.d) + '</p></div>' + S.icon(on ? 'tick' : 'lock') + '</div>';
  });
  html += '</div>';

  html += '<hr class="rule"><p class="hint" style="margin-top:26px">Your app is read only on purpose. Every number in it got there because you told the builder, and that conversation is what keeps it alive. The moment you can tap numbers in silently, you stop talking to it.</p>';

  page.innerHTML = html;

  document.getElementById('edit').addEventListener('click', function () {
    var v = window.prompt('Update the link to your app', app.url);
    if (v === null) return;
    var r = S.checkUrl(v);
    if (!r.ok) { S.toast(r.msg); return; }
    S.saveApp(r.url); S.toast('Link updated'); window.location.reload();
  });
})();
</script>
</body>
</html>
