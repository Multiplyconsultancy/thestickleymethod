<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modules | The Self-Mastery System</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/member/start/start.css">
</head>
<body>
<div class="topbar"></div>
<div class="shell">
  <aside class="rail"></aside>
  <main class="main"><div class="wrap" id="page"></div></main>
</div>
<nav class="tabbar"></nav>

<script src="/member/start/data/path.js"></script>
<script src="/member/start/start.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   PHASE + LESSON.

   Lessons down the left, the lesson itself on the right, one button at
   the bottom. Deliberately the shape of a course portal, because that
   is a shape people already know how to read without being taught.

   Everything else in this product is navigation. This is where a prompt
   either gets copied into Base44 or does not, so it is built around
   removing every reason to stall: no empty prompt box ever, answers
   that survive a trip to Base44 and back, per-message sent ticks so
   nobody loses their place in a six-message day, and every predictable
   failure pre-empted in the copy instead of in a support email.
══════════════════════════════════════════════════════════════════════ */
(function () {
  var P = window.PATH;
  var ph = P.phase(S.qs('p') || 'seven');
  var page = document.getElementById('page');
  if (!ph) ph = P.phases[0];

  S.boot('modules');

  /* ── Lesson state ─────────────────────────────────────────────── */
  function lessonDone(l) { return l.kind === 'day' ? S.done(l.day) : !!S.Store.get('intro.' + l.id, false); }
  function lessonOpen(l) { return l.kind === 'day' ? S.unlocked(l.day) : true; }

  var lessons = ph.lessons;
  var wanted = S.qs('l');
  var cur = lessons.filter(function (l) { return l.id === wanted; })[0];
  if (!cur) cur = lessons.filter(function (l) { return lessonOpen(l) && !lessonDone(l); })[0] || lessons[lessons.length - 1];

  var d = (cur && cur.kind === 'day') ? P.day(cur.day) : null;
  var accent = d ? d.accent : ph.accent;
  document.title = (cur ? cur.title : ph.title) + ' | The Self-Mastery System';

  function msgKey(i) { return d.n + '.' + i; }

  /* ── The lesson list ──────────────────────────────────────────── */
  function list() {
    var out = '<aside class="llist"><div class="llist__h">' + S.esc(ph.title) + ' &middot; ' +
      lessons.filter(lessonDone).length + '/' + lessons.length + '</div>';
    lessons.forEach(function (l, i) {
      var done = lessonDone(l), open = lessonOpen(l), isCur = cur && l.id === cur.id;
      var cls = (done ? ' is-done' : '') + (isCur ? ' is-cur' : '') + (!open ? ' is-locked' : '');
      var style = isCur && l.kind === 'day' ? ' style="--day:' + P.day(l.day).accent + '"' : '';
      var inner = '<span class="lrow__n">' + (done ? S.icon('tick') : (i + 1)) + '</span>' +
        '<span class="lrow__t"><b>' + S.esc(l.title) + '</b><span>' + l.mins + ' min' +
        (l.kind === 'day' ? ' &middot; ' + (P.day(l.day).messages.length || 'no') + ' prompt' + (P.day(l.day).messages.length === 1 ? '' : 's') : '') +
        '</span></span>' + (!open ? S.icon('lock') : '');
      out += open
        ? '<a class="lrow' + cls + '"' + style + ' href="/member/start/phase?p=' + ph.id + '&l=' + l.id + '">' + inner + '</a>'
        : '<div class="lrow' + cls + '">' + inner + '</div>';
    });
    return out + '</aside>';
  }

  /* ── The intro lesson ─────────────────────────────────────────── */
  function intro() {
    var done = lessonDone(cur);
    return '<div class="lhero"><span class="lhero__eyebrow">' + S.esc(ph.title) + '</span>' +
      '<h2>' + S.esc(cur.title) + '</h2>' +
      '<p class="lede">What this is, how it works, and exactly where to begin. Watch this before anything else.</p>' +
      '<div class="lhero__meta"><span class="pill pill--a">' + cur.mins + ' min</span>' +
      '<span class="pill">Watch first</span></div></div>' +

      '<div class="card" style="padding:0;overflow:hidden;margin-bottom:16px">' +
        '<div style="aspect-ratio:16/9;display:grid;place-items:center;background:var(--bg-2);border-bottom:1px solid var(--line-soft)">' +
          '<div style="text-align:center;padding:20px">' + S.icon('play') +
          '<p style="color:var(--faint);font-size:13.5px;margin-top:10px">Baby’s welcome video goes here.<br>The slot is wired — it needs the file.</p></div>' +
        '</div>' +
      '</div>' +

      '<div class="card"><span class="label">In the meantime, the short version</span>' +
        '<p style="color:var(--muted);margin-bottom:14px">You are about to build one private app that runs the five areas you actually control: your body, your mind, your appearance, your character and your money.</p>' +
        '<p style="color:var(--muted);margin-bottom:14px">It takes seven days. Day one is the long one — about forty-five minutes, six prompts, and you finish with a published app that has your real numbers in it. Days two to seven are ten to twenty minutes each, and every one of them adds something.</p>' +
        '<p style="color:var(--muted);margin-bottom:14px">Every prompt is written for you, word for word. You never have to work out what to type. You answer plain questions here, the message writes itself, you paste it into Base44 and send it.</p>' +
        '<p style="color:var(--muted)">One rule worth knowing now: your app will have no forms and no buttons to edit anything. Everything enters by you telling it. That is on purpose — the app is the scoreboard, the conversation is the game.</p>' +
      '</div>' +

      '<div class="btn-row">' + (done
        ? '<a class="btn btn--primary" href="/member/start/phase?p=seven">Start Day 1 &rarr;</a>' +
          '<button class="btn btn--ghost" id="unmark">Mark as not done</button>'
        : '<button class="btn btn--primary" id="mark">Mark complete &amp; start Day 1</button>') +
      '</div>';
  }

  /* ── A day lesson ─────────────────────────────────────────────── */
  function dayLesson() {
    if (!S.unlocked(d.n)) {
      return '<div class="lhero"><span class="lhero__eyebrow">' + S.esc(d.eyebrow) + '</span>' +
        '<h2>' + S.esc(d.title) + '</h2>' +
        '<p class="lede">Finish Day ' + (d.n - 1) + ' first. One thing at a time is the whole idea.</p></div>' +
        '<a class="btn btn--primary" href="/member/start/phase?p=seven&l=d' + (d.n - 1) + '">Go to Day ' + (d.n - 1) + ' &rarr;</a>';
    }

    var isDone = S.done(d.n);
    var html = '<div class="lhero"><span class="lhero__eyebrow">' + S.esc(d.eyebrow) + ' &middot; ' + S.esc(d.theme) + '</span>' +
      '<h2>' + S.esc(d.title) + '</h2>' +
      '<p class="lede">' + S.esc(d.summary) + '</p>' +
      '<div class="lhero__meta"><span class="pill pill--a">~' + d.minutes + ' min</span>' +
      '<span class="pill">' + (d.messages.length || 'No') + ' prompt' + (d.messages.length === 1 ? '' : 's') + '</span>' +
      (d.submit ? '<span class="pill">Submit your app</span>' : '') +
      (isDone ? '<span class="pill">Done</span>' : '') + '</div></div>';

    if (isDone) {
      html += '<div class="done-box"><h2>Day ' + d.n + ' is done.</h2>' +
        '<p class="lede">' + (d.n < 7 ? 'Day ' + (d.n + 1) + ' is open whenever you are. Nothing here expires.'
                                      : 'That is the seven. Everything is unlocked.') + '</p>' +
        '<div class="btn-row">' +
        (d.n < 7 ? '<a class="btn btn--primary" href="/member/start/phase?p=seven&l=d' + (d.n + 1) + '">Day ' + (d.n + 1) + ' &rarr;</a>'
                 : '<a class="btn btn--primary" href="/member/start/bonus">See what opened &rarr;</a>') +
        '</div></div>' +
        (d.messages.length ? '<p class="label" style="margin-top:30px">The prompts, if you need them again</p>' : '');
    } else {
      html += '<div class="card" style="margin-bottom:16px"><p style="color:var(--muted)">' + S.esc(d.why) + '</p></div>';
      html += '<div class="sec" style="margin-top:0"><span class="label">What you are doing</span><ol class="steps">' +
        d.steps.map(function (s) { return '<li><b>' + S.esc(s.b) + '</b><span>' + S.esc(s.s) + '</span></li>'; }).join('') +
        '</ol></div>';
    }

    /* ── Messages ── */
    if (d.messages.length) {
      html += '<div class="sec"><span class="label">' +
        (d.messages.length === 1 ? 'Your prompt' : 'Your ' + d.messages.length + ' prompts, in order') + '</span>';

      d.messages.forEach(function (m, i) {
        var saved = S.answers(msgKey(i));
        var hasQ = (m.questions || []).length > 0;
        var sent = !!saved._sent;
        var open = !hasQ || Object.keys(saved).filter(function (k) { return k !== '_sent' && saved[k]; }).length > 0;

        html += '<div class="msg' + (sent ? ' is-sent' : '') + '" id="m' + i + '">' +
          '<div class="msg__bar"><span class="msg__n">Message ' + (i + 1) + ' of ' + d.messages.length + '</span>' +
          '<span class="msg__mode">' + S.esc(m.mode) + '</span>' +
          (m.label ? '<span class="msg__n">' + S.esc(m.label) + '</span>' : '') +
          '<span class="sp"></span>' +
          '<button class="btn btn--sm' + (sent ? '' : ' btn--primary') + '" data-copy="' + i + '">' +
          (sent ? 'Copy again' : 'Copy') + '</button></div>';

        if (hasQ) {
          html += '<div class="qs">';
          m.questions.forEach(function (q) {
            var v = S.esc(saved[q.id] || '');
            html += '<div class="field"><label for="q' + i + '_' + q.id + '">' + S.esc(q.label) + '</label>' +
              (q.hint ? '<p class="hint">' + S.esc(q.hint) + '</p>' : '') +
              (q.area
                ? '<textarea class="input" id="q' + i + '_' + q.id + '" data-m="' + i + '" data-q="' + q.id + '" placeholder="' + S.esc(q.ph || '') + '">' + v + '</textarea>'
                : '<input class="input" id="q' + i + '_' + q.id + '" data-m="' + i + '" data-q="' + q.id + '" value="' + v + '" placeholder="' + S.esc(q.ph || '') + '">') +
              '</div>';
          });
          html += '<button class="btn btn--block" style="margin:4px 0 16px" data-write="' + i + '">' +
            (open ? 'Update my prompt' : 'Write my prompt') + '</button></div>';
        }

        html += '<pre class="msg__body" id="t' + i + '"' + (open ? '' : ' style="display:none"') + '>' +
          S.esc(open ? S.build(m, saved) : '') + '</pre>';
        if (m.note) html += '<div class="msg__note">' + S.esc(m.note) + '</div>';
        html += '<div class="msg__foot"><button class="btn btn--sm btn--ghost" data-sent="' + i + '">' +
          (sent ? '&#10003; Sent' : 'Mark as sent') + '</button>' +
          '<span style="color:var(--faint);font-size:13px">' +
          (sent ? 'Done.' : 'Paste it into Base44 and send it as one message.') + '</span></div></div>';
      });

      html += '<div class="btn-row"><a class="btn" href="https://app.base44.com" target="_blank" rel="noopener">Open Base44 &#8599;</a></div>' +
        '<p class="hint" style="margin-top:13px">Your app will not look like anybody else’s. Same prompt, different build — that is normal. If one thing is broken, tell the builder to fix that one thing. If a build sits thinking for a few minutes, let it: do not resend and do not refresh.</p></div>';
    }

    if (isDone) return html;

    /* ── The gate ── */
    html += '<hr class="rule"><div class="sec">';
    if (d.submit) {
      html += '<span class="label">Last step</span><h2 style="font-size:25px">Paste your app link</h2>' +
        '<p style="color:var(--muted);margin:8px 0 18px;max-width:52ch">Publish it in Base44 first and set it to private. That link is what opens Day 2.</p>' +
        '<div class="field"><label for="u">Your Base44 app link</label>' +
        '<input class="input" id="u" type="url" inputmode="url" spellcheck="false" placeholder="https://your-app.base44.app"></div>' +
        '<p class="err" id="e"></p><button class="btn btn--primary btn--block" id="finish">Submit and open Day 2</button>';
    } else if (d.review) {
      html += '<span class="label">Last step</span><h2 style="font-size:25px">What changes next week?</h2>' +
        '<p style="color:var(--muted);margin:8px 0 18px;max-width:52ch">One thing. Not five. It is the only output of the whole week that matters.</p>' +
        '<div class="field"><textarea class="input" id="chg" placeholder="The one thing I am changing next week is..."></textarea></div>' +
        '<p class="err" id="e"></p><button class="btn btn--primary btn--block" id="finish">Finish the seven</button>';
    } else {
      html += '<span class="label">Last step</span><h2 style="font-size:25px">Done for today?</h2>' +
        '<p style="color:var(--muted);margin:8px 0 18px;max-width:52ch">Only mark this once the prompt has actually been sent and the change is live in your app.</p>' +
        '<button class="btn btn--primary btn--block" id="finish">Mark Day ' + d.n + ' complete</button>';
    }
    return html + '</div>';
  }

  /* ── Render ───────────────────────────────────────────────────── */
  function render() {
    page.innerHTML =
      '<a class="back" href="/member/start/modules">' + S.icon('back') + 'All modules</a>' +
      '<div class="lesson-wrap" style="--day:' + accent + '">' + list() +
      '<div class="lbody">' + (d ? dayLesson() : intro()) + '</div></div>';
    wire();
  }

  function wire() {
    var mk = document.getElementById('mark');
    if (mk) mk.addEventListener('click', function () {
      S.Store.set('intro.' + cur.id, true); S.checkIn();
      window.location.href = '/member/start/phase?p=seven&l=d1';
    });
    var un = document.getElementById('unmark');
    if (un) un.addEventListener('click', function () { S.Store.set('intro.' + cur.id, false); render(); });

    if (!d) return;

    page.querySelectorAll('[data-q]').forEach(function (el) {
      el.addEventListener('input', function () {
        var i = parseInt(el.getAttribute('data-m'), 10);
        var a = S.answers(msgKey(i));
        a[el.getAttribute('data-q')] = el.value;
        S.saveAnswers(msgKey(i), a);
        var pre = document.getElementById('t' + i);
        if (pre && pre.style.display !== 'none') pre.textContent = S.build(d.messages[i], a);
      });
    });
    page.querySelectorAll('[data-write]').forEach(function (b) {
      b.addEventListener('click', function () {
        var i = parseInt(b.getAttribute('data-write'), 10);
        var pre = document.getElementById('t' + i);
        pre.textContent = S.build(d.messages[i], S.answers(msgKey(i)));
        pre.style.display = ''; b.textContent = 'Update my prompt';
        pre.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    });
    page.querySelectorAll('[data-copy]').forEach(function (b) {
      b.addEventListener('click', function () {
        var i = parseInt(b.getAttribute('data-copy'), 10);
        var pre = document.getElementById('t' + i);
        if (pre.style.display === 'none') { pre.textContent = S.build(d.messages[i], S.answers(msgKey(i))); pre.style.display = ''; }
        S.copy(S.build(d.messages[i], S.answers(msgKey(i))), 'Copied — paste it into Base44');
      });
    });
    page.querySelectorAll('[data-sent]').forEach(function (b) {
      b.addEventListener('click', function () {
        var i = parseInt(b.getAttribute('data-sent'), 10);
        var a = S.answers(msgKey(i)); a._sent = !a._sent;
        S.saveAnswers(msgKey(i), a); render();
        var el = document.getElementById('m' + i); if (el) el.scrollIntoView({ block: 'center' });
      });
    });

    var fin = document.getElementById('finish');
    if (!fin) return;
    fin.addEventListener('click', function () {
      var err = document.getElementById('e');
      if (d.submit) {
        var r = S.checkUrl(document.getElementById('u').value);
        if (!r.ok) { err.textContent = r.msg; err.classList.add('on'); return; }
        err.classList.remove('on'); S.saveApp(r.url); S.completeDay(d.n, { url: r.url });
        if (r.msg) S.toast(r.msg);
      } else if (d.review) {
        var v = document.getElementById('chg').value.trim();
        if (!v) { err.textContent = 'Write the one thing. It takes ten seconds and it is the point of the week.'; err.classList.add('on'); return; }
        err.classList.remove('on'); S.completeDay(d.n, { change: v });
      } else { S.completeDay(d.n, {}); }
      window.location.href = '/member/start/done?d=' + d.n;
    });
  }

  render();
})();
</script>
</body>
</html>
