<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day complete | The Self-Mastery System</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/member/start/start.css">
</head>
<body>
<div class="topbar"></div>
<div class="shell">
  <aside class="rail"></aside>
  <main class="main"><div class="wrap wrap--narrow" id="page"></div></main>
</div>
<nav class="tabbar"></nav>
<script src="/member/start/data/path.js"></script>
<script src="/member/start/start.js"></script>
<script>
/* The completion moment. Meaningful and premium rather than confetti:
   one statement, the numbers, one next step. */
(function () {
  S.boot('modules');
  var P = window.PATH, n = parseInt(S.qs('d') || '1', 10);
  var d = P.day(n), next = P.day(n + 1), page = document.getElementById('page');
  var accent = d ? d.accent : 'var(--gold)';

  function wrap(inner) {
    return '<div style="--day:' + accent + ';padding-top:6vh">' + inner + '</div>';
  }

  if (n === 1) {
    page.innerHTML = wrap(
      '<div class="lhero"><span class="lhero__eyebrow">Day One &middot; Complete</span>' +
      '<h2>Your system is live.</h2>' +
      '<p class="lede">You don’t need to change your entire life today. Start by keeping the promises you make to yourself — that is tomorrow.</p>' +
      (S.app() ? '<a class="appurl" href="' + S.esc(S.app().url) + '" target="_blank" rel="noopener">' + S.esc(S.app().url) + '</a>' : '') +
      '<div class="btn-row"><a class="btn btn--primary" href="/member/start/phase?p=seven&l=d2">Day 2 &rarr;</a>' +
      '<a class="btn btn--ghost" href="/member/start">Home</a></div></div>' +
      '<p class="hint" style="margin-top:20px;color:var(--faint);font-size:13.5px">Come back tomorrow. The rewards need seven separate days, so racing ahead builds the app faster but does not finish the week sooner.</p>');
    return;
  }

  if (n === 7) {
    page.innerHTML = wrap(
      '<div class="lhero"><span class="lhero__eyebrow">The seven are done</span>' +
      '<h2>That’s the week.</h2>' +
      '<p class="lede">A working system with your own numbers in it, a coach in your pocket, and seven days of real records. Most people never get past watching.</p></div>' +
      '<div class="phases" style="grid-template-columns:repeat(3,1fr)">' +
        '<div class="pcard" style="--day:var(--gold)"><div class="pcard__top"><span class="chip">' + S.icon('crown') + '</span></div>' +
          '<h3 style="font-size:30px">7</h3><p style="min-height:0">Days done</p></div>' +
        '<div class="pcard" style="--day:#34D399"><div class="pcard__top"><span class="chip">' + S.icon('chart') + '</span></div>' +
          '<h3 style="font-size:30px">' + S.activeDays() + '</h3><p style="min-height:0">Active days</p></div>' +
        '<div class="pcard" style="--day:#06B6D4"><div class="pcard__top"><span class="chip">' + S.icon('chat') + '</span></div>' +
          '<h3 style="font-size:30px">' + P.totalPrompts() + '</h3><p style="min-height:0">Builds sent</p></div>' +
      '</div>' +
      '<div class="btn-row"><a class="btn btn--primary" href="/member/start/bonus">See what opened &rarr;</a>' +
      '<a class="btn btn--ghost" href="/member/start/my-system">My system</a></div>');
    return;
  }

  page.innerHTML = wrap(
    '<div class="lhero"><span class="lhero__eyebrow">' + S.esc(d.eyebrow) + ' &middot; Complete</span>' +
    '<h2>' + S.esc(d.title) + ' is in.</h2>' +
    '<p class="lede">' + S.doneCount() + ' of 7 done.' +
    (next ? ' Next: ' + S.esc(next.title) + ', about ' + next.minutes + ' minutes.' : '') + '</p>' +
    '<div class="btn-row">' +
    (next ? '<a class="btn btn--primary" href="/member/start/phase?p=seven&l=d' + (n + 1) + '">Day ' + (n + 1) + ' &rarr;</a>' : '') +
    '<a class="btn btn--ghost" href="/member/start">Home</a></div></div>' +
    '<p class="hint" style="margin-top:20px;color:var(--faint);font-size:13.5px">Tell your app what happened today before you close it. That check-in is what keeps the grid honest.</p>');
})();
</script></body></html>
