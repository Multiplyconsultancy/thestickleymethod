<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Community | The Self-Mastery System</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/member/start/start.css">
</head>
<body>
<div class="topbar"></div>
<div class="shell">
  <aside class="rail"></aside>
  <main class="main"><div class="wrap" id="page"></div></main>
</div>
<nav class="tabbar"></nav>
<script src="/member/hq/data/catalogue.js"></script>
<script src="/member/start/data/path.js"></script>
<script src="/member/start/start.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   COMMUNITY.

   Locked until the seven are done, and it says what is behind the lock
   rather than just refusing. Once open it is a real page with a real
   empty state: no invented members, no seeded threads. A fabricated
   community is obvious within one scroll and costs more trust than an
   honest empty room.
══════════════════════════════════════════════════════════════════════ */
(function () {
  S.boot('comm');
  var page = document.getElementById('page');
  var open = S.ladderOpen();

  if (!open) {
    var left = 7 - S.doneCount();
    page.innerHTML = '<div class="phead"><h1>The Community</h1>' +
      '<p class="sub">Opens when the seven days are done.</p></div>' +
      '<div class="locked" style="--day:#3FA5B8"><span class="chip">' + S.icon('community') + '</span>' +
      '<h2>' + left + ' day' + (left === 1 ? '' : 's') + ' to go.</h2>' +
      '<p>Private chat with everyone else building the same system. It stays locked until you have built yours — a room full of people who have not done the work is just a room.</p>' +
      '<div class="btn-row" style="justify-content:center">' +
      '<a class="btn btn--primary" href="/member/start/phase?p=seven">Continue the seven &rarr;</a></div></div>';
    return;
  }

  page.innerHTML = '<div class="phead"><h1>The Community</h1>' +
    '<p class="sub">Everyone who finished the seven.</p></div>' +
    '<div class="thread"><span class="av">BS</span><div class="thread__b">' +
    '<div class="who"><b>Baby</b><span>Pinned</span></div>' +
    '<p>You built it, so you are in. Post what you built, what broke, and what you changed after your first weekly review. ' +
    'Screenshots of your own board are worth more here than anything I can say.</p></div></div>' +
    '<div class="empty" style="margin-top:14px"><p>No threads yet — this is a new cohort.</p>' +
    '<p style="color:var(--faint);font-size:13px;margin-top:8px">Real posts from real members only. Nothing here is seeded.</p>' +
    '<a class="btn btn--primary" href="/member/start/my-system">Open my system</a></div>';
})();
</script></body></html>
