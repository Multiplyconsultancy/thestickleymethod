<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Library | The Self-Mastery System</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/member/start/start.css">
</head>
<body>
<div class="topbar"></div>
<div class="shell">
  <aside class="rail"></aside>
  <main class="main"><div class="wrap" id="page"></div></main>
</div>
<nav class="tabbar"></nav>
<script src="/member/hq/data/catalogue.js"></script>
<script src="/member/start/data/path.js"></script>
<script src="/member/start/start.js"></script>
<script>
/* The twenty-four extra builds. Reuses the catalogue from the first HQ
   build rather than duplicating it: one prompt, one place. Locked until
   the week is done, because a library on day one is the buffet that made
   the first version unusable. */
(function () {
  S.boot('modules');
  var page = document.getElementById('page');

  var TINT = { body:'#F43F6E', appearance:'#A855F7', mind:'#3B82F6', character:'#22C55E', wealth:'#FFC24B' };

  if (!S.ladderOpen()) {
    page.innerHTML = '<div class="phead"><h1>The Library</h1>' +
      '<p class="sub">Opens when the seven days are done.</p></div>' +
      '<div class="lhero" style="--day:var(--gold)"><span class="lhero__eyebrow">Locked</span>' +
      '<h2>Twenty-four more tools.</h2>' +
      '<p class="lede">Trackers for training, food, skin, focus, money and the rest — each one a written prompt. ' +
      'They open together at Day 7, not before: a wall of options on day one is how people end up building nothing.</p>' +
      '<div class="lhero__meta"><span class="pill pill--a">' + S.doneCount() + ' / 7 days</span>' +
      '<span class="pill">' + S.activeDays() + ' / 7 active days</span></div>' +
      '<div class="btn-row"><a class="btn btn--primary" href="/member/start/phase?p=seven">Continue the seven &rarr;</a></div></div>';
    return;
  }

  var active = S.qs('p') || 'all';
  var list = active === 'all' ? window.SMS.builds : window.SMS.byPillar(active);

  var html = '<div class="phead"><h1>The Library</h1>' +
    '<p class="sub">Twenty-four tools. Start with ours, then make the system yours.</p></div>';

  html += '<div class="lhero__meta" style="margin:0 0 18px">' +
    '<a class="pill' + (active === 'all' ? ' pill--a' : '') + '" href="/member/start/library">All ' + window.SMS.builds.length + '</a>' +
    window.SMS.pillars.map(function (p) {
      return '<a class="pill' + (active === p.id ? ' pill--a' : '') + '" href="/member/start/library?p=' + p.id + '">' +
        S.esc(p.short) + '</a>';
    }).join('') + '</div>';

  list.forEach(function (b) {
    var p = window.SMS.pillar(b.pillar), a = TINT[b.pillar] || 'var(--gold)';
    html += '<a class="lad" style="--a:' + a + '" href="/member/start/build?id=' + b.id + '">' +
      '<span class="chip" style="--a:' + a + '">' + S.icon('grid') + '</span>' +
      '<div><h3>' + S.esc(b.title) + '</h3><p>' + S.esc(p.short) + ' &middot; ~' + b.minutes +
      ' min &middot; ' + S.esc(b.short) + '</p></div></a>';
  });

  page.innerHTML = html;
})();
</script></body></html>
