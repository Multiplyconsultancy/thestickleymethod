<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modules | The Self-Mastery System</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/member/start/start.css">
</head>
<body>
<div class="topbar"></div>
<div class="shell">
  <aside class="rail"></aside>
  <main class="main"><div class="wrap" id="page"></div></main>
</div>
<nav class="tabbar"></nav>
<script src="/member/start/data/path.js"></script>
<script src="/member/start/start.js"></script>
<script>
(function () {
  S.boot('modules');
  /* One phase card. The accent lives on the element so the wash, the
     bar and the chip all read it from a single custom property. */
  function pcard(p) {
    var open = !p.gated || S.ladderOpen();
    var done = p.lessons.filter(function (l) {
      return l.kind === 'day' ? S.done(l.day) : !!S.Store.get('intro.' + l.id, false);
    }).length;
    var tot = p.lessons.length;
    var pct = tot ? Math.round(done / tot * 100) : (open ? 100 : 0);
    var href = p.id === 'library' ? '/member/start/library' : '/member/start/phase?p=' + p.id;
    var sub = tot ? done + ' / ' + tot + ' lessons' : '24 builds';
    if (p.id === 'seven') sub += ' &middot; ' + window.PATH.totalPrompts() + ' prompts';
    var inner =
      '<div class="pcard__top"><span class="chip">' + S.icon(p.mark) + '</span>' +
        '<span class="pcard__eyebrow">Phase ' + p.n + '</span>' +
        (open ? '' : '<span class="pcard__lock">' + S.icon('lock') + '</span>') + '</div>' +
      '<h3>' + S.esc(p.title) + '</h3><p>' + S.esc(p.blurb) + '</p>' +
      '<div class="pcard__foot"><span>' + sub + '</span><span class="pc">' + pct + '%</span></div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>';
    return (open ? '<a class="pcard" href="' + href + '"' : '<div class="pcard is-locked"') +
      ' style="--day:' + p.accent + '">' + inner + (open ? '</a>' : '</div>');
  }
  var P = window.PATH;
  document.getElementById('page').innerHTML =
    '<div class="phead"><h1>Modules</h1>' +
    '<p class="sub">' + P.phases.length + ' phases. Finish each one to unlock the next.</p></div>' +
    '<div class="phases">' + P.phases.map(pcard).join('') + '</div>';
})();
</script></body></html>
