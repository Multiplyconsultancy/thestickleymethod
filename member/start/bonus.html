<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bonus | The Self-Mastery System</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/member/start/start.css">
</head>
<body>
<div class="topbar"></div>
<div class="shell">
  <aside class="rail"></aside>
  <main class="main"><div class="wrap" id="page"></div></main>
</div>
<nav class="tabbar"></nav>
<script src="/member/start/data/path.js"></script>
<script src="/member/start/start.js"></script>
<script>
(function () {
  S.boot('bonus');
  var P = window.PATH, open = S.ladderOpen();
  var done = S.doneCount(), pct = Math.round(done / 7 * 100), left = Math.max(0, 7 - done);

  var html = '<div class="phead"><h1>Fast Start</h1>' +
    '<p class="sub">Finish all seven days. That is the whole requirement.</p></div>';

  html += '<div class="banner"><div class="banner__t">' +
    '<h2>' + (open ? 'All unlocked.' : 'Fast Start Rewards') + '</h2>' +
    '<p>' + (open ? 'You did the week. Everything below is yours.'
                  : done + ' of 7 days done &middot; ' + S.activeDays() + ' active days') + '</p>' +
    '<div class="bar" style="--a:var(--gold)"><i style="width:' + pct + '%"></i></div></div>' +
    (open ? '' : '<div class="cd" id="cd" style="flex:0 0 auto;min-width:250px"></div>') + '</div>';

  P.unlocks.forEach(function (u) {
    html += '<div class="lad' + (open ? ' is-open' : '') + '" style="--a:' + u.accent + '">' +
      '<span class="chip" style="--a:' + u.accent + '">' + S.icon(u.mark) + '</span>' +
      '<div><h3>' + S.esc(u.title) + '</h3><p>' + S.esc(u.sub) + '</p></div>' +
      '<span class="lad__s">' + S.icon(open ? 'tick' : 'lock') + '</span></div>';
  });

  html += '<div class="cont"><div><b>' + (left ? left + ' day' + (left > 1 ? 's' : '') + ' left' : 'Everything is open') + '</b>' +
    '<span>' + (left ? 'Then all four unlock at once.' : 'Nothing left to earn here.') + '</span></div>' +
    '<a class="btn btn--primary" href="' + (open ? '/member/start/library' : '/member/start/phase?p=seven') + '">' +
    (open ? 'Open the Library' : 'Continue the seven') + ' &rarr;</a></div>';

  document.getElementById('page').innerHTML = html;

  /* Live. The old version only moved when the page was refreshed,
     which is not a countdown. */
  var el = document.getElementById('cd');
  if (el) S.tick(function () {
    var ms = S.clock();
    if (ms === null) { el.innerHTML = '<div><b>&mdash;</b><span>Starts on Day 1</span></div>'; return; }
    el.innerHTML = S.clockFace(ms).map(function (u) {
      return '<div><b>' + u.v + '</b><span>' + u.l + '</span></div>';
    }).join('');
  });
})();
</script></body></html>
