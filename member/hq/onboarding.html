<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set up your HQ | The Self-Mastery System</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/member/hq/hq.css">
<style>
/* ══════════════════════════════════════════════════════════════════════
   ONBOARDING.

   Five screens, no chrome, no navigation. Deliberately not a profiling
   exercise: two questions, both multi-select, both skippable. Every
   extra question here is a member who never reaches their first build,
   and the answers only steer a recommendation that they are free to
   ignore on the very next screen.

   Nothing is scored and nothing is hidden as a result of the answers.
══════════════════════════════════════════════════════════════════════ */
body{padding:0}
.ob{max-width:620px;margin-inline:auto;padding:clamp(28px,7vh,72px) 22px 80px;min-height:100vh;display:flex;flex-direction:column}
.ob__bar{display:flex;gap:5px;margin:0 0 44px}
.ob__bar i{height:2px;flex:1;background:var(--line);border-radius:2px;transition:background .3s}
.ob__bar i.on{background:var(--accent)}
.ob__body{flex:1}
.ob h1{font-size:clamp(30px,5.6vw,42px)}
.ob .lede{color:var(--muted);font-size:17px;margin-top:13px}
.ob__foot{display:flex;align-items:center;gap:12px;margin-top:38px}
.ob__foot .skip{color:var(--faint);font-size:14.5px;background:none;border:0}
.ob__foot .skip:hover{color:var(--muted)}
.ob__foot .sp{flex:1}
.pick{border:1px solid var(--line);border-radius:var(--radius-lg);padding:clamp(20px,4vw,30px);background:var(--surface);margin-top:26px}
.pick h2{font-size:clamp(25px,4vw,33px)}
.pick .lede{font-size:16px;margin-top:9px}
.step{display:none}
.step.on{display:block;animation:in .32s ease both}
@keyframes in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="ob">
  <div class="ob__bar" id="bar"></div>
  <div class="ob__body" id="body"></div>
</div>

<script src="/member/hq/data/catalogue.js"></script>
<script src="/member/hq/hq.js"></script>
<script>
(function () {
  var TOTAL = 5;
  var state = { step: 1, name: '', focus: [], blockers: [] };

  var FOCUS = [
    { id: 'body', label: 'Body' },
    { id: 'appearance', label: 'Appearance' },
    { id: 'discipline', label: 'Discipline' },
    { id: 'emotional-control', label: 'Emotional control' },
    { id: 'character', label: 'Character' },
    { id: 'confidence', label: 'Confidence' },
    { id: 'income', label: 'Income' },
  ];
  var BLOCKERS = [
    { id: 'inconsistency', label: 'Inconsistency' },
    { id: 'procrastination', label: 'Procrastination' },
    { id: 'cheap-dopamine', label: 'Cheap dopamine' },
    { id: 'lust', label: 'Porn / lust' },
    { id: 'routines', label: 'Poor routines' },
    { id: 'confidence', label: 'Lack of confidence' },
    { id: 'direction', label: 'No clear income direction' },
    { id: 'structure', label: 'No structure' },
  ];

  /* Shared with the home screen. See HQ.recommend in hq.js. */
  function recommend() {
    return HQ.recommend({ rawFocus: state.focus, blockers: state.blockers });
  }

  /* Focus answers are stored as pillar ids where they map cleanly, so
     the rest of the HQ can filter by pillar without a second lookup. */
  function focusPillars() {
    var map = {
      body: 'body', appearance: 'appearance', discipline: 'mind',
      'emotional-control': 'mind', character: 'character',
      confidence: 'character', income: 'wealth',
    };
    var out = [];
    state.focus.forEach(function (f) {
      if (map[f] && out.indexOf(map[f]) === -1) out.push(map[f]);
    });
    return out;
  }

  function chips(list, selected, onToggle) {
    return '<div class="chips">' + list.map(function (o) {
      var on = selected.indexOf(o.id) > -1;
      return '<button type="button" data-id="' + o.id + '" aria-pressed="' + on + '">' + HQ.esc(o.label) + '</button>';
    }).join('') + '</div>';
  }

  function bar() {
    var out = '';
    for (var i = 1; i <= TOTAL; i++) out += '<i class="' + (i <= state.step ? 'on' : '') + '"></i>';
    document.getElementById('bar').innerHTML = out;
  }

  function go(n) { state.step = n; render(); window.scrollTo(0, 0); }

  function finish(r) {
    HQ.saveProfile({
      name: state.name.trim(),
      focus: focusPillars(),
      rawFocus: state.focus,
      blockers: state.blockers,
      onboardedAt: new Date().toISOString(),
    });
    window.location.href = '/member/hq/build?id=' + r.id;
  }

  function render() {
    bar();
    var el = document.getElementById('body');
    var r;

    if (state.step === 1) {
      el.innerHTML =
        '<div class="step on"><span class="label">The Self-Mastery System</span>' +
        '<h1>You can control more than you think.</h1>' +
        '<p class="lede">Not everything. But your effort, your habits, your body, your attention, your standards, and how you treat people — all of that is yours. This is where you build the systems that make acting on it easier than not.</p>' +
        '<p class="lede">Two questions, then you build your first tool. Under ten minutes.</p>' +
        '<div class="field" style="margin-top:30px"><label for="nm">First name (optional)</label>' +
        '<input class="input" id="nm" type="text" maxlength="30" autocomplete="given-name" value="' + HQ.esc(state.name) + '" placeholder="What should we call you?"></div>' +
        '<div class="ob__foot"><button class="btn btn--primary" id="next">Begin &rarr;</button></div></div>';
      document.getElementById('next').addEventListener('click', function () {
        state.name = document.getElementById('nm').value || '';
        go(2);
      });
      document.getElementById('nm').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') document.getElementById('next').click();
      });
      return;
    }

    if (state.step === 2 || state.step === 3) {
      var isFocus = state.step === 2;
      var list = isFocus ? FOCUS : BLOCKERS;
      var sel  = isFocus ? state.focus : state.blockers;
      el.innerHTML =
        '<div class="step on"><span class="label">Question ' + (isFocus ? '1' : '2') + ' of 2</span>' +
        '<h1>' + (isFocus ? 'What do you want to improve right now?' : 'What’s currently getting in your way?') + '</h1>' +
        '<p class="lede">' + (isFocus
          ? 'Pick as many as are true. This is not a score and nothing gets hidden — it only decides what we put in front of you first.'
          : 'Be honest. Nobody sees this but you, and the answer decides which tool you build first.') + '</p>' +
        '<div style="margin-top:26px">' + chips(list, sel) + '</div>' +
        '<div class="ob__foot">' +
          '<button class="btn btn--ghost" id="back">Back</button>' +
          '<span class="sp"></span>' +
          '<button class="skip" id="skip">Skip</button>' +
          '<button class="btn btn--primary" id="next">Continue &rarr;</button>' +
        '</div></div>';

      el.querySelectorAll('.chips button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-id');
          var i = sel.indexOf(id);
          if (i > -1) sel.splice(i, 1); else sel.push(id);
          btn.setAttribute('aria-pressed', i === -1);
        });
      });
      document.getElementById('back').addEventListener('click', function () { go(state.step - 1); });
      document.getElementById('skip').addEventListener('click', function () { go(state.step + 1); });
      document.getElementById('next').addEventListener('click', function () { go(state.step + 1); });
      return;
    }

    if (state.step === 4) {
      r = recommend();
      var p = window.SMS.pillar(r.pillar);
      el.innerHTML =
        '<div class="step on"><span class="label">Where to start</span>' +
        '<h1>Start here.</h1>' +
        '<p class="lede">Based on what you just told us. You can change it on the next screen and nothing is locked behind this choice.</p>' +
        '<div class="pick"><span class="label">' + HQ.esc(p.name) + '</span>' +
          '<h2>' + HQ.esc(r.title) + '</h2>' +
          '<p class="lede">' + HQ.esc(r.problem) + '</p>' +
          '<div class="hero__meta"><span><b>~' + r.minutes + '</b> minutes</span><span><b>' + HQ.esc(r.difficulty) + '</b></span><span>Copy and paste, no code</span></div>' +
        '</div>' +
        '<div class="ob__foot"><button class="btn btn--ghost" id="back">Back</button><span class="sp"></span>' +
        '<button class="btn btn--primary" id="next">Continue &rarr;</button></div></div>';
      document.getElementById('back').addEventListener('click', function () { go(3); });
      document.getElementById('next').addEventListener('click', function () { go(5); });
      return;
    }

    /* Screen 5: the handover. One button, and an escape hatch that still
       completes onboarding rather than dumping them back at the start. */
    r = recommend();
    el.innerHTML =
      '<div class="step on"><span class="label">Last screen</span>' +
      '<h1>Now build it.</h1>' +
      '<p class="lede">The prompt is already written. You copy it, paste it into Base44, and it builds the tool for you. Nothing to code and nothing to configure.</p>' +
      '<p class="lede">When it is done you paste the link back here, and it lives in your HQ from then on.</p>' +
      '<div class="ob__foot"><button class="btn btn--ghost" id="back">Back</button><span class="sp"></span>' +
      '<button class="skip" id="later">Browse instead</button>' +
      '<button class="btn btn--primary" id="go">Build ' + HQ.esc(r.title) + ' &rarr;</button></div></div>';
    document.getElementById('back').addEventListener('click', function () { go(4); });
    document.getElementById('go').addEventListener('click', function () { finish(r); });
    document.getElementById('later').addEventListener('click', function () {
      HQ.saveProfile({
        name: state.name.trim(), focus: focusPillars(), rawFocus: state.focus,
        blockers: state.blockers, onboardedAt: new Date().toISOString(),
      });
      window.location.href = '/member/hq/builds';
    });
  }

  render();
})();
</script>
</body>
</html>
