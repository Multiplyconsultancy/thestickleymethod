<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow"><title>Redirecting</title></head><body>
<script>
/* The path/day routes were replaced by the phase + lesson layout.
   Kept so any link already shared still lands in the right place. */
(function () {
  var d = new URL(location.href).searchParams.get('d');
  location.replace('/phase?p=seven' + (d ? '&l=d' + d : ''));
})();
</script></body></html>
