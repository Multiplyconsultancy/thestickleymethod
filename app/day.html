<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day | The Self-Mastery System</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/start.css">
</head>
<body>
<div class="topbar"></div>
<div class="shell">
  <aside class="rail"></aside>
  <main class="main"><div class="wrap" id="page"></div></main>
</div>
<nav class="tabbar"></nav>

<script src="/data/path.js"></script>
<script src="/start.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   A DAY.

   Modules down the left as 1.1, 1.2, 1.3; the selected module on the
   right. One module on screen at a time, because six stacked on one page
   is a wall and a wall is where people stop.

   This is the only page in the product where a prompt gets copied into
   Base44, so it is built around removing every reason to stall: no empty
   prompt box ever, answers that survive a trip to Base44 and back,
   checkpoints before moving on, and every predictable failure pre-empted
   in the copy rather than in a support email.

   Two gates, both with live countdowns. A day cannot be closed until its
   own minimum time has passed, and the next day opens on a timer after
   this one closes.
══════════════════════════════════════════════════════════════════════ */
(function () {
  var P = window.PATH;
  var n = parseInt(S.qs('d') || '1', 10);
  var d = P.day(n);
  var page = document.getElementById('page');

  if (!d) { window.location.replace('/phase?p=seven'); return; }
  S.boot('modules');
  document.title = 'Day ' + n + ' · ' + d.title + ' | The Self-Mastery System';

  var stops = [];
  function clearTicks() { stops.forEach(function (f) { f(); }); stops = []; }
  function key(i) { return n + '.' + i; }
  function face(el, ms) {
    el.innerHTML = S.clockFace(ms).map(function (u) {
      return '<div><b>' + u.v + '</b><span>' + u.l + '</span></div>';
    }).join('');
  }

  /* ── Locked ─────────────────────────────────────────────────────── */
  if (!S.unlocked(n)) {
    var ms = S.openIn(n);
    page.innerHTML = '<a class="back" href="/phase?p=seven">' + S.icon('back') + 'The First Seven</a>' +
      '<div class="locked" style="--day:' + d.accent + '"><span class="chip">' + S.icon('lock') + '</span>' +
      '<h2>' + S.esc(d.title) + '</h2>' +
      (ms === null
        ? '<p>Finish Day ' + (n - 1) + ' first. One thing at a time is the whole idea.</p>' +
          '<div class="btn-row" style="justify-content:center"><a class="btn btn--primary" href="/day?d=' + (n - 1) + '">Go to Day ' + (n - 1) + ' &rarr;</a></div>'
        : '<p>Day ' + n + ' opens ' + S.UNLOCK_HOURS + ' hours after you finished Day ' + (n - 1) +
          '. Seven days is the point — a week of honest records cannot be crammed into one evening.</p>' +
          '<div class="cd" id="lk"></div>' +
          '<div class="btn-row" style="justify-content:center"><a class="btn btn--ghost" href="/phase?p=seven">Back to the seven</a></div>') +
      '</div>';
    var lk = document.getElementById('lk');
    if (lk) S.tick(function () {
      var left = S.openIn(n);
      if (left <= 0) { window.location.reload(); return; }
      face(lk, left);
    });
    return;
  }

  S.firstSeen(n);                                    // starts the minimum-time clock

  /* Which module is showing. */
  var want = S.qs('m');
  var cur = d.parts.filter(function (p) { return p.id === want; })[0];
  if (!cur) cur = d.parts.filter(function (p) { return !S.partDone(n, p.id); })[0] || d.parts[d.parts.length - 1];
  var idx = d.parts.indexOf(cur);

  /* ── The module rail ────────────────────────────────────────────── */
  function rail() {
    var nDone = d.parts.filter(function (p) { return S.partDone(n, p.id); }).length;
    var out = '<aside class="llist"><div class="mrail__h"><b>' + S.esc(d.title) + '</b>' +
      '<span>' + nDone + ' of ' + d.parts.length + ' modules &middot; ~' + d.minutes + ' min</span></div>';
    d.parts.forEach(function (p) {
      var isDone = S.partDone(n, p.id), isCur = p.id === cur.id;
      out += '<a class="mrow' + (isDone ? ' is-done' : '') + (isCur ? ' is-cur' : '') + '" ' +
        'href="/day?d=' + n + '&m=' + p.id + '">' +
        '<span class="mrow__n">' + (isDone ? S.icon('tick') : S.esc(p.id)) + '</span>' +
        '<span class="mrow__t"><b>' + S.esc(p.title) + '</b><span>' + p.mins + ' min &middot; 1 prompt</span></span></a>';
    });

    /* The day gate sits at the bottom of the rail, always visible. */
    var all = S.allPartsDone(n);
    out += '<div style="padding:14px 15px;border-top:1px solid var(--line-soft)">' +
      (all ? '<a class="btn btn--primary btn--block btn--sm" href="#close">Close the day &darr;</a>'
           : '<span style="color:var(--faint);font-size:12.5px">' +
             (d.parts.length - nDone) + ' module' + (d.parts.length - nDone === 1 ? '' : 's') + ' left</span>') +
      '</div>';
    return out + '</aside>';
  }

  /* ── The selected module ────────────────────────────────────────── */
  function moduleBody() {
    var pt = cur, m = pt.message, i = idx;
    var isDone = S.partDone(n, pt.id);
    var saved = S.answers(key(i));
    var hasQ = (m.questions || []).length > 0;
    var sent = !!saved._sent;
    var written = !hasQ || Object.keys(saved).filter(function (k) { return k !== '_sent' && saved[k]; }).length > 0;

    var h = '<div class="lhero"><span class="lhero__eyebrow">' + S.esc(d.eyebrow) +
      ' &middot; Module ' + S.esc(pt.id) + '</span>' +
      '<h2>' + S.esc(pt.title) + '</h2>' +
      '<p class="lede">' + S.esc(pt.blurb) + '</p>' +
      '<div class="lhero__meta"><span class="pill pill--a">' + pt.mins + ' min</span>' +
      '<span class="pill">1 prompt</span>' + (isDone ? '<span class="pill">Done</span>' : '') + '</div></div>';

    h += '<span class="label">What to do</span><ol class="steps">' + pt.steps.map(function (s) {
      return '<li><b>' + S.esc(s.b) + '</b><span>' + S.esc(s.s) + '</span></li>';
    }).join('') + '</ol>';

    h += '<div class="sec"><span class="label">Your prompt</span>' +
      '<div class="msg' + (sent ? ' is-sent' : '') + '">' +
      '<div class="msg__bar"><span class="msg__n">' + S.esc(pt.id) + '</span>' +
      '<span class="msg__mode">' + S.esc(m.mode) + '</span>' +
      (m.label ? '<span class="msg__n">' + S.esc(m.label) + '</span>' : '') +
      '<span class="sp"></span>' +
      '<button class="btn btn--sm' + (sent ? '' : ' btn--primary') + '" id="copy">' +
      (sent ? 'Copy again' : 'Copy') + '</button></div>';

    if (hasQ) {
      h += '<div class="qs">';
      m.questions.forEach(function (q) {
        var v = S.esc(saved[q.id] || '');
        h += '<div class="field"><label for="q_' + q.id + '">' + S.esc(q.label) + '</label>' +
          (q.hint ? '<p class="hint">' + S.esc(q.hint) + '</p>' : '') +
          (q.area
            ? '<textarea class="input" id="q_' + q.id + '" data-q="' + q.id + '" placeholder="' + S.esc(q.ph || '') + '">' + v + '</textarea>'
            : '<input class="input" id="q_' + q.id + '" data-q="' + q.id + '" value="' + v + '" placeholder="' + S.esc(q.ph || '') + '">') +
          '</div>';
      });
      h += '<button class="btn btn--block" style="margin:4px 0 15px" id="write">' +
        (written ? 'Update my prompt' : 'Write my prompt') + '</button></div>';
    }

    h += '<pre class="msg__body" id="txt"' + (written ? '' : ' style="display:none"') + '>' +
      S.esc(written ? S.build(m, saved) : '') + '</pre>';
    if (m.note) h += '<div class="msg__note">' + S.esc(m.note) + '</div>';
    h += '<div class="msg__foot"><button class="btn btn--sm btn--ghost" id="sent">' +
      (sent ? '&#10003; Sent' : 'Mark as sent') + '</button>' +
      '<span style="color:var(--faint);font-size:13px">' +
      (sent ? 'Done.' : 'Paste it into Base44 and send it as one message.') + '</span>' +
      '<a class="btn btn--sm btn--ghost" style="margin-left:auto" href="https://app.base44.com" target="_blank" rel="noopener">Base44 &#8599;</a>' +
      '</div></div>';

    h += '<p class="hint" style="margin-top:12px">Your app will not look like anybody else’s. Same prompt, different build — that is normal. If one thing is broken, tell the builder to fix that one thing. If a build sits thinking for a few minutes, let it: do not resend and do not refresh.</p></div>';

    if (pt.check && pt.check.length) {
      h += '<ul class="chk"><li class="chk__h" style="display:block">Before you move on</li>' +
        pt.check.map(function (c) { return '<li>' + S.icon('tick') + '<span>' + S.esc(c) + '</span></li>'; }).join('') + '</ul>';
    }

    var next = d.parts[idx + 1];
    h += '<div class="btn-row">' + (isDone
      ? '<button class="btn btn--ghost" id="undo">Mark as not done</button>' +
        (next ? '<a class="btn btn--primary" href="/day?d=' + n + '&m=' + next.id + '">Next module &rarr;</a>' : '')
      : '<button class="btn btn--primary" id="moddone">Module done' + (next ? ' &rarr; ' + S.esc(next.id) : '') + '</button>') +
      '</div>';

    return h;
  }

  /* ── Closing the day ────────────────────────────────────────────── */
  function closer() {
    if (S.done(n)) {
      var nx = P.day(n + 1);
      return '<div class="done-box" id="close"><h2>Day ' + n + ' is done.</h2>' +
        '<p class="lede">' + (nx ? 'Day ' + (n + 1) + ' opens ' + S.UNLOCK_HOURS + ' hours after you closed this one.'
                                 : 'That is the seven. Everything is unlocked.') + '</p>' +
        (nx ? (S.openIn(n + 1) > 0
                ? '<div class="cd" id="nx" style="max-width:320px;margin-top:16px"></div>'
                : '<div class="btn-row"><a class="btn btn--primary" href="/day?d=' + (n + 1) + '">Day ' + (n + 1) + ' &rarr;</a></div>')
            : '<div class="btn-row"><a class="btn btn--primary" href="/bonus">See what opened &rarr;</a></div>') +
        '</div>';
    }

    if (!S.allPartsDone(n)) {
      var left = d.parts.length - d.parts.filter(function (p) { return S.partDone(n, p.id); }).length;
      return '<div class="gate" id="close"><div><b>Finish all ' + d.parts.length + ' modules</b>' +
        '<span>' + left + ' left before you can close the day.</span></div></div>';
    }

    var h = '<div id="close">';
    if (!S.canSubmit(n)) {
      h += '<div class="gate gate--wait" id="gate">' +
        '<div class="gw"><span class="gw__i">' + S.icon('lock') + '</span>' +
        '<span class="gw__t"><b>' + (d.submit ? 'Submit unlocks shortly' : 'Hold on') + '</b>' +
        '<span>Day ' + n + ' is meant to take about ' + d.minutes + ' minutes. Go and actually build it \u2014 ' +
        'the button turns on by itself.</span></span>' +
        '<span class="gw__c"><b id="gt">\u2014</b><span>Until it opens</span></span></div>' +
        '<span class="gw__bar"><i id="gbar" style="width:0%"></i></span></div>';
    }
    if (d.submit) {
      h += '<h2 style="font-size:24px;margin-top:18px">Paste your app link</h2>' +
        '<p style="color:var(--muted);margin:8px 0 16px;max-width:52ch">Publish it in Base44 and set it to private. That link is what opens Day 2.</p>' +
        '<div class="field"><label for="u">Your Base44 app link</label>' +
        '<input class="input" id="u" type="url" inputmode="url" spellcheck="false" placeholder="https://your-app.base44.app"></div>';
    } else if (d.review) {
      h += '<h2 style="font-size:24px;margin-top:18px">What changes next week?</h2>' +
        '<p style="color:var(--muted);margin:8px 0 16px;max-width:52ch">One thing. Not five. It is the only output of the whole week that matters.</p>' +
        '<div class="field"><textarea class="input" id="chg" placeholder="The one thing I am changing next week is..."></textarea></div>';
    } else {
      h += '<h2 style="font-size:24px;margin-top:18px">Close the day</h2>' +
        '<p style="color:var(--muted);margin:8px 0 16px;max-width:52ch">Only close it once every prompt has been sent and the changes are live in your app.</p>';
    }
    return h + '<p class="err" id="e"></p>' +
      '<button class="btn btn--primary btn--block" id="finish"' + (S.canSubmit(n) ? '' : ' disabled') + '>' +
      (d.submit ? 'Submit and finish Day 1' : d.review ? 'Finish the seven' : 'Mark Day ' + n + ' complete') + '</button></div>';
  }

  /* ── Render ─────────────────────────────────────────────────────── */
  function render() {
    clearTicks();
    var nDone = d.parts.filter(function (p) { return S.partDone(n, p.id); }).length;
    var pct = Math.round(nDone / d.parts.length * 100);

    page.innerHTML =
      '<a class="back" href="/phase?p=seven">' + S.icon('back') + 'The First Seven</a>' +
      '<div class="phead" style="margin-bottom:18px"><h1>' + S.esc(d.eyebrow) + ' &middot; ' + S.esc(d.title) + '</h1>' +
      '<p class="sub">' + S.esc(d.builds) + ' &middot; ' + nDone + ' of ' + d.parts.length + ' modules done</p>' +
      '<div class="bar" style="--a:' + d.accent + ';max-width:320px;margin-top:11px"><i style="width:' + pct + '%"></i></div></div>' +
      '<div class="lesson-wrap" style="--day:' + d.accent + '">' + rail() +
      '<div class="lbody">' + moduleBody() + '<hr class="rule">' + closer() + '</div></div>';
    wire();
  }

  function wire() {
    var m = cur.message;

    page.querySelectorAll('[data-q]').forEach(function (el) {
      el.addEventListener('input', function () {
        var a = S.answers(key(idx));
        a[el.getAttribute('data-q')] = el.value;
        S.saveAnswers(key(idx), a);
        var pre = document.getElementById('txt');
        if (pre && pre.style.display !== 'none') pre.textContent = S.build(m, a);
      });
    });

    var w = document.getElementById('write');
    if (w) w.addEventListener('click', function () {
      var pre = document.getElementById('txt');
      pre.textContent = S.build(m, S.answers(key(idx)));
      pre.style.display = ''; w.textContent = 'Update my prompt';
    });

    var c = document.getElementById('copy');
    if (c) c.addEventListener('click', function () {
      var pre = document.getElementById('txt');
      if (pre.style.display === 'none') { pre.textContent = S.build(m, S.answers(key(idx))); pre.style.display = ''; }
      S.copy(S.build(m, S.answers(key(idx))), 'Copied — paste it into Base44');
    });

    var st = document.getElementById('sent');
    if (st) st.addEventListener('click', function () {
      var a = S.answers(key(idx)); a._sent = !a._sent; S.saveAnswers(key(idx), a); render();
    });

    var md = document.getElementById('moddone');
    if (md) md.addEventListener('click', function () {
      S.completePart(n, cur.id);
      var next = d.parts[idx + 1];
      if (next && !S.partDone(n, next.id)) { window.location.href = '/day?d=' + n + '&m=' + next.id; }
      else { render(); var el = document.getElementById('close'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    });

    var ud = document.getElementById('undo');
    if (ud) ud.addEventListener('click', function () { S.uncompletePart(n, cur.id); render(); });

    var gt = document.getElementById('gt');
    if (gt) stops.push(S.tick(function () {
      var total = (d.minMinutes || 0) * 60000;
      var ms = S.submitIn(n);
      gt.textContent = S.shortLeft(ms);
      var bar = document.getElementById('gbar');
      if (bar && total) bar.style.width = Math.min(100, (1 - ms / total) * 100).toFixed(1) + '%';
      if (ms <= 0) {
        var g = document.getElementById('gate'); if (g) g.remove();
        var f = document.getElementById('finish');
        if (f) { f.removeAttribute('disabled'); S.toast('Submit is open'); }
      }
    }));

    var nx = document.getElementById('nx');
    if (nx) stops.push(S.tick(function () {
      var ms = S.openIn(n + 1);
      if (ms <= 0) { window.location.reload(); return; }
      face(nx, ms);
    }));

    var fin = document.getElementById('finish');
    if (fin) fin.addEventListener('click', function () {
      if (!S.canSubmit(n)) return;
      var err = document.getElementById('e');
      if (d.submit) {
        var r = S.checkUrl(document.getElementById('u').value);
        if (!r.ok) { err.textContent = r.msg; err.classList.add('on'); return; }
        err.classList.remove('on'); S.saveApp(r.url); S.completeDay(n, { url: r.url });
        if (r.msg) S.toast(r.msg);
      } else if (d.review) {
        var v = document.getElementById('chg').value.trim();
        if (!v) { err.textContent = 'Write the one thing. It takes ten seconds and it is the point of the week.'; err.classList.add('on'); return; }
        err.classList.remove('on'); S.completeDay(n, { change: v });
      } else { S.completeDay(n, {}); }
      window.location.href = '/done?d=' + n;
    });
  }

  render();
})();
</script>
</body>
</html>
