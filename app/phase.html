<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modules | The Self-Mastery System</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/start.css">
</head>
<body>
<div class="topbar"></div>
<div class="shell">
  <aside class="rail"></aside>
  <main class="main"><div class="wrap" id="page"></div></main>
</div>
<nav class="tabbar"></nav>
<script src="/data/path.js"></script>
<script src="/start.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   A PHASE.

   The level that was missing. Modules -> PHASE -> Day -> Module, so the
   seven days read as seven boxes in the same format as the phase grid
   above them, each showing either its progress or how long until it
   opens. A locked day is shown, never hidden: the road ahead is the
   motivation, and a member who cannot see day four has no reason to
   finish day three.
══════════════════════════════════════════════════════════════════════ */
(function () {
  var P = window.PATH;
  var ph = P.phase(S.qs('p') || 'seven') || P.phases[0];
  var page = document.getElementById('page');
  S.boot('modules');
  document.title = ph.title + ' | The Self-Mastery System';

  /* ── Phase 1: a single intro lesson, so render it directly. ── */
  if (ph.id === 'start') {
    var l = ph.lessons[0], isDone = !!S.Store.get('intro.' + l.id, false);
    page.innerHTML =
      '<a class="back" href="/modules">' + S.icon('back') + 'All modules</a>' +
      '<div style="--day:' + ph.accent + '">' +
      '<div class="lhero"><span class="lhero__eyebrow">Phase 1 &middot; ' + S.esc(ph.title) + '</span>' +
      '<h2>' + S.esc(l.title) + '</h2>' +
      '<p class="lede">What this is, how it works, and exactly where to begin.</p>' +
      '<div class="lhero__meta"><span class="pill pill--a">' + l.mins + ' min</span>' +
      '<span class="pill">1 lesson</span>' + (isDone ? '<span class="pill">Done</span>' : '') + '</div></div>' +

      '<div class="card" style="padding:0;overflow:hidden;margin-bottom:14px">' +
      '<div style="aspect-ratio:16/9;display:grid;place-items:center;background:var(--bg-2)">' +
      '<div style="text-align:center;padding:20px;color:var(--faint)">' + S.icon('play') +
      '<p style="font-size:13px;margin-top:10px">Baby’s welcome video goes here.<br>The slot is wired — it needs the file.</p></div></div></div>' +

      '<div class="card"><span class="label">The short version</span>' +
      '<p style="color:var(--muted);margin-bottom:13px">You are about to build one private app that runs the five areas you actually control: your body, your mind, your appearance, your character and your money.</p>' +
      '<p style="color:var(--muted);margin-bottom:13px">Seven days, ' + P.totalPrompts() + ' prompts. Day one is the long one — about forty-five minutes across six modules, ending in a published app with your real numbers in it. Every day after that opens ' + S.UNLOCK_HOURS + ' hours later and takes twenty to thirty minutes.</p>' +
      '<p style="color:var(--muted);margin-bottom:13px">Every prompt is written for you. You answer plain questions, the message assembles itself, you paste it into Base44 and send it. You never have to work out what to type.</p>' +
      '<p style="color:var(--muted)">One rule worth knowing now: your app will have no forms and no edit buttons. Everything enters by you telling it. That is deliberate — the app is the scoreboard, the conversation is the game.</p></div>' +

      '<div class="btn-row">' + (isDone
        ? '<a class="btn btn--primary" href="/phase?p=seven">Go to The First Seven &rarr;</a>' +
          '<button class="btn btn--ghost" id="un">Mark as not done</button>'
        : '<button class="btn btn--primary" id="mk">Mark complete &amp; continue</button>') + '</div></div>';

    var mk = document.getElementById('mk');
    if (mk) mk.addEventListener('click', function () {
      S.Store.set('intro.' + l.id, true); S.checkIn();
      window.location.href = '/phase?p=seven';
    });
    var un = document.getElementById('un');
    if (un) un.addEventListener('click', function () { S.Store.set('intro.' + l.id, false); window.location.reload(); });
    return;
  }

  /* ── Phase 3: the library lives on its own page. ── */
  if (ph.id === 'library') { window.location.replace('/library'); return; }

  /* ── Phase 2: the seven days, as a grid. ── */
  var introDone = !!S.Store.get('intro.welcome', false);
  var nDone = S.doneCount();

  var html = '<a class="back" href="/modules">' + S.icon('back') + 'All modules</a>' +
    '<div class="phead"><h1>' + S.esc(ph.title) + '</h1>' +
    '<p class="sub">' + nDone + ' of 7 days done &middot; ' + P.totalPrompts() +
    ' prompts &middot; one day opens every ' + S.UNLOCK_HOURS + ' hours</p></div>';

  if (!introDone) {
    html += '<div class="gate" style="margin:0 0 18px"><div><b>Watch the welcome first</b>' +
      '<span>Phase 1 takes four minutes and explains how the week works.</span></div>' +
      '<a class="btn btn--primary" style="margin-left:auto" href="/phase?p=start">Watch it &rarr;</a></div>';
  }

  html += '<div class="days">';
  P.days.forEach(function (d) {
    var isDone = S.done(d.n), open = S.unlocked(d.n);
    var done = d.parts.filter(function (p) { return S.partDone(d.n, p.id); }).length;
    var pct = Math.round(done / d.parts.length * 100);
    var cls = isDone ? ' is-done' : (open ? '' : ' is-locked');
    var wait = (!open && !isDone) ? S.openIn(d.n) : null;

    var inner =
      '<div class="dcard__top"><span class="dcard__n">' +
        (isDone ? S.icon('tick') : open ? d.n : S.icon('lock')) + '</span>' +
        '<span class="dcard__eyebrow">' + S.esc(d.eyebrow) + ' &middot; ' + S.esc(d.theme) + '</span></div>' +
      '<h3>' + S.esc(d.title) + '</h3><p>' + S.esc(d.summary) + '</p>';

    if (wait !== null && wait > 0) {
      inner += '<div class="dcard__wait" data-wait="' + d.n + '">' + S.icon('lock') +
        '<span>Unlocks in <span data-cd="' + d.n + '">—</span></span></div>';
    } else if (wait === null && !isDone) {
      inner += '<div class="dcard__wait">' + S.icon('lock') + '<span>Finish Day ' + (d.n - 1) + ' first</span></div>';
    } else {
      inner += '<div class="dcard__foot"><span>' + done + ' / ' + d.parts.length + ' modules &middot; ~' +
        d.minutes + ' min</span><span class="pc">' + pct + '%</span></div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>';
    }

    html += (open || isDone)
      ? '<a class="dcard' + cls + '" style="--day:' + d.accent + '" href="/day?d=' + d.n + '">' + inner + '</a>'
      : '<div class="dcard' + cls + '" style="--day:' + d.accent + '">' + inner + '</div>';
  });
  html += '</div>';

  page.innerHTML = html;

  /* Live countdowns on every locked day card. */
  P.days.forEach(function (d) {
    var el = page.querySelector('[data-cd="' + d.n + '"]');
    if (!el) return;
    S.tick(function () {
      var ms = S.openIn(d.n);
      if (ms === null) return;
      if (ms <= 0) { window.location.reload(); return; }
      el.textContent = S.shortLeft(ms);
    });
  });
})();
</script></body></html>
