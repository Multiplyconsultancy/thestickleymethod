<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build | The Self-Mastery System</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/start.css">
</head>
<body>
<div class="topbar"></div>
<div class="shell">
  <aside class="rail"></aside>
  <main class="main"><div class="wrap" id="page"></div></main>
</div>
<nav class="tabbar"></nav>
<script src="/data/catalogue.js"></script>
<script src="/data/path.js"></script>
<script src="/start.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   A LIBRARY BUILD.

   A library build, rendered in this app's own design. Nothing links out
   to another product: a member who finishes the seven-day path stays
   inside the same interface when they open the library.
══════════════════════════════════════════════════════════════════════ */
(function () {
  S.boot('modules');
  var page = document.getElementById('page');
  var b = window.SMS.build(S.qs('id'));

  if (!S.ladderOpen()) { window.location.replace('/library'); return; }
  if (!b) {
    page.innerHTML = '<a class="back" href="/library">' + S.icon('back') + 'The Library</a>' +
      '<div class="phead"><h1>Build not found</h1><p class="sub">It may have been renamed.</p></div>' +
      '<a class="btn btn--primary" href="/library">Back to the Library</a>';
    return;
  }

  var TINT = { body:'#D94F6E', appearance:'#8B6FD4', mind:'#4A7FD4', character:'#4FA97A', wealth:'#D9A441' };
  var p = window.SMS.pillar(b.pillar), a = TINT[b.pillar] || 'var(--gold)';
  var saved = S.Store.get('lib.' + b.id, null);
  document.title = b.title + ' | The Self-Mastery System';

  function render() {
    var h = '<a class="back" href="/library">' + S.icon('back') + 'The Library</a>' +
      '<div style="--day:' + a + '">' +
      '<div class="lhero"><span class="lhero__eyebrow">' + S.esc(p.name) + '</span>' +
      '<h2>' + S.esc(b.title) + '</h2><p class="lede">' + S.esc(b.short) + '</p>' +
      '<div class="lhero__meta"><span class="pill pill--a">~' + b.minutes + ' min</span>' +
      '<span class="pill">' + S.esc(b.difficulty) + '</span><span class="pill">1 prompt</span>' +
      (saved ? '<span class="pill">In your system</span>' : '') + '</div></div>';

    h += '<div class="bwhy"><b style="color:var(--text)">What it fixes.</b> ' + S.esc(b.problem) + '</div>';
    if (b.long) h += '<div class="bwhy" style="margin-top:12px">' + S.esc(b.long) + '</div>';

    if (saved) {
      h += '<div class="done-box" style="margin-top:22px"><h2>' + S.esc(b.title) + ' is live.</h2>' +
        '<p class="lede">Saved into your system.</p>' +
        '<a class="appurl" href="' + S.esc(saved) + '" target="_blank" rel="noopener">' + S.esc(saved) + '</a>' +
        '<div class="btn-row"><a class="btn btn--primary" href="' + S.esc(saved) + '" target="_blank" rel="noopener">Open it &#8599;</a>' +
        '<button class="btn btn--ghost" id="edit">Update link</button>' +
        '<button class="btn btn--ghost" id="rm">Remove</button></div></div>' +
        '<p class="label" style="margin-top:26px">The prompt, if you need it again</p>';
    } else {
      h += '<div class="sec"><span class="label">How this works</span><ol class="steps">' +
        '<li><b>Copy the prompt</b><span>It is written for you. Do not edit it before sending.</span></li>' +
        '<li><b>Open Base44 and start a new app</b><span>Same email you use here.</span></li>' +
        '<li><b>Paste it as one message and send</b><span>Let it build. Do not resend or refresh.</span></li>' +
        '<li><b>Publish it and set it to private</b><span>Then paste the link below.</span></li></ol></div>';
    }

    h += '<div class="sec"><span class="label">Your prompt</span><div class="msg">' +
      '<div class="msg__bar"><span class="msg__n">Send as one message</span>' +
      '<span class="msg__mode">BUILD</span><span class="sp"></span>' +
      '<button class="btn btn--sm btn--primary" id="copy">Copy</button></div>' +
      '<pre class="msg__body">' + S.esc(b.prompt) + '</pre>' +
      '<div class="msg__foot"><a class="btn btn--sm btn--ghost" href="https://app.base44.com" target="_blank" rel="noopener">Open Base44 &#8599;</a>' +
      '<span style="color:var(--faint);font-size:13px">Paste it as one message.</span></div></div></div>';

    if (!saved) {
      h += '<hr class="rule"><div class="sec"><span class="label">Last step</span>' +
        '<h2 style="font-size:24px">Save it to your system</h2>' +
        '<p style="color:var(--muted);margin:8px 0 16px;max-width:52ch">Publish it in Base44 first, then paste the link.</p>' +
        '<div class="field"><label for="u">Your Base44 app link</label>' +
        '<input class="input" id="u" type="url" inputmode="url" spellcheck="false" placeholder="https://your-app.base44.app"></div>' +
        '<p class="err" id="e"></p>' +
        '<button class="btn btn--primary btn--block" id="save">Save to my system</button></div>';
    }

    page.innerHTML = h + '</div>';
    wire();
  }

  function wire() {
    document.getElementById('copy').addEventListener('click', function () {
      S.copy(b.prompt, 'Copied — paste it into Base44');
    });
    var sv = document.getElementById('save');
    if (sv) sv.addEventListener('click', function () {
      var err = document.getElementById('e');
      var r = S.checkUrl(document.getElementById('u').value);
      if (!r.ok) { err.textContent = r.msg; err.classList.add('on'); return; }
      err.classList.remove('on');
      S.Store.set('lib.' + b.id, r.url); saved = r.url;
      if (r.msg) S.toast(r.msg);
      render(); window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    var ed = document.getElementById('edit');
    if (ed) ed.addEventListener('click', function () {
      var v = window.prompt('Update the link', saved);
      if (v === null) return;
      var r = S.checkUrl(v);
      if (!r.ok) { S.toast(r.msg); return; }
      S.Store.set('lib.' + b.id, r.url); saved = r.url; render();
    });
    var rm = document.getElementById('rm');
    if (rm) rm.addEventListener('click', function () {
      if (!window.confirm('Remove ' + b.title + ' from your system?\n\nYour app in Base44 is not touched.')) return;
      S.Store.set('lib.' + b.id, null); saved = null; render();
    });
  }

  render();
})();
</script></body></html>
