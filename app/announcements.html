<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Announcements | The Self-Mastery System</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/start.css">
</head>
<body>
<div class="topbar"></div>
<div class="shell">
  <aside class="rail"></aside>
  <main class="main"><div class="wrap" id="page"></div></main>
</div>
<nav class="tabbar"></nav>
<script src="/data/path.js"></script>
<script src="/start.js"></script>
<script>
(function () {
  S.boot('ann');
  /* Real posts from the team. This page is never gated, on purpose:
     it is the one channel that can reach somebody who has stalled. */
  var POSTS = [
    { d: '21 Sep', t: 'The Library is live at Day 7', a: 'Baby',
      b: 'Twenty-four more builds are waiting behind the seven days — trackers for training, skin, focus, money, all of it. Finish the week and the whole thing opens at once.' },
    { d: '19 Sep', t: 'Read-only is not a bug', a: 'Baby',
      b: 'A few of you have asked why your app has no edit buttons. It is deliberate. The moment you can tap a number in silently you stop talking to it, and the thing dies in a week. Tell it what happened. That is the whole system.' },
    { d: '17 Sep', t: 'Day 1 takes about 45 minutes', a: 'The team',
      b: 'Do not start it on a phone between things. Sit down with a laptop, six prompts, one sitting. Every other day is ten to twenty minutes.' },
  ];
  var html = '<div class="phead"><h1>Announcements</h1><p class="sub">From Baby and the team.</p></div>';
  POSTS.forEach(function (p) {
    html += '<div class="card" style="margin-bottom:12px">' +
      '<div style="display:flex;gap:10px;align-items:center;margin-bottom:9px">' +
      '<span class="pill">' + S.esc(p.d) + '</span><span class="pill">' + S.esc(p.a) + '</span></div>' +
      '<h3 style="font-size:19px">' + S.esc(p.t) + '</h3>' +
      '<p style="color:var(--muted);margin-top:8px">' + S.esc(p.b) + '</p></div>';
  });
  document.getElementById('page').innerHTML = html;
})();
</script></body></html>
