<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My System | The Self-Mastery System</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/start.css">
</head>
<body>
<div class="topbar"></div>
<div class="shell">
  <aside class="rail"></aside>
  <main class="main"><div class="wrap wrap--narrow" id="page"></div></main>
</div>
<nav class="tabbar"></nav>
<script src="/data/path.js"></script>
<script src="/start.js"></script>
<script>
(function () {
  S.boot('system');
  var P = window.PATH, app = S.app(), page = document.getElementById('page');

  if (!app) {
    page.innerHTML = '<div class="phead"><h1>Nothing built yet.</h1>' +
      '<p class="sub">Day One builds it. Forty-five minutes, six prompts, all copy and paste.</p></div>' +
      '<div class="empty"><p>Your app will show up here the moment you paste its link.</p>' +
      '<a class="btn btn--primary" href="/phase?p=seven&l=d1">Start Day 1 &rarr;</a></div>';
    return;
  }

  /* What the app can do is derived from days finished, so this page
     visibly accumulates. That accumulation is the retention claim. */
  var html = '<div class="phead"><h1>Your app</h1>' +
    '<p class="sub">Everything you have built this week, in one place.</p></div>' +
    '<div class="lhero" style="--day:var(--gold)">' +
      '<span class="lhero__eyebrow">Live</span><h2>Self-Mastery System</h2>' +
      '<a class="appurl" href="' + S.esc(app.url) + '" target="_blank" rel="noopener">' + S.esc(app.url) + '</a>' +
      '<div class="btn-row"><a class="btn btn--primary" href="' + S.esc(app.url) + '" target="_blank" rel="noopener">Open my system &#8599;</a>' +
      '<button class="btn btn--ghost" id="edit">Update link</button></div></div>';

  html += '<div class="sec"><div class="sec__head"><h2>What it does</h2></div>';
  P.days.forEach(function (d) {
    var on = S.done(d.n);
    html += '<div class="lad' + (on ? ' is-open' : '') + '" style="--a:' + d.accent + '">' +
      '<span class="chip" style="--a:' + d.accent + '">' + S.icon(d.mark) + '</span>' +
      '<div><h3>' + S.esc(d.title) + '</h3><p>' + (on ? S.esc(d.summary) : 'Added on Day ' + d.n) + '</p></div>' +
      '<span class="lad__s">' + S.icon(on ? 'tick' : 'lock') + '</span></div>';
  });
  html += '</div>';

  html += '<hr class="rule"><p class="hint" style="margin-top:20px;color:var(--faint);font-size:13.5px">' +
    'Your app is read only on purpose. Every number in it got there because you told the builder, and that ' +
    'conversation is what keeps it alive. The moment you can tap numbers in silently, you stop talking to it.</p>';

  page.innerHTML = html;
  document.getElementById('edit').addEventListener('click', function () {
    var v = window.prompt('Update the link to your app', app.url);
    if (v === null) return;
    var r = S.checkUrl(v);
    if (!r.ok) { S.toast(r.msg); return; }
    S.saveApp(r.url); S.toast('Link updated'); location.reload();
  });
})();
</script></body></html>
