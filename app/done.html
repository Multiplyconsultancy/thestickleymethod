<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day complete | The Self-Mastery System</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/start.css">
</head>
<body>
<div class="topbar"></div>
<div class="shell">
  <aside class="rail"></aside>
  <main class="main"><div class="wrap wrap--narrow" id="page"></div></main>
</div>
<nav class="tabbar"></nav>
<script src="/data/path.js"></script>
<script src="/start.js"></script>
<script>
(function () {
  S.boot('modules');
  var P = window.PATH, n = parseInt(S.qs('d') || '1', 10);
  var d = P.day(n), next = P.day(n + 1), page = document.getElementById('page');
  var accent = d ? d.accent : 'var(--gold)';

  function shell(inner) { return '<div style="--day:' + accent + ';padding-top:5vh">' + inner + '</div>'; }

  if (n === 7) {
    page.innerHTML = shell(
      '<div class="lhero"><span class="lhero__eyebrow">The seven are done</span>' +
      '<h2>That’s the week.</h2>' +
      '<p class="lede">A working system with your own numbers in it, a coach in your pocket, and seven days of real records. Most people never get past watching.</p></div>' +
      '<div class="phases" style="grid-template-columns:repeat(3,1fr)">' +
        '<div class="pcard" style="--day:var(--gold)"><div class="pcard__top"><span class="chip">' + S.icon('crown') + '</span></div>' +
          '<h3 style="font-size:28px">7</h3><p>Days done</p></div>' +
        '<div class="pcard" style="--day:#4FA97A"><div class="pcard__top"><span class="chip">' + S.icon('chart') + '</span></div>' +
          '<h3 style="font-size:28px">' + S.activeDays() + '</h3><p>Active days</p></div>' +
        '<div class="pcard" style="--day:#3FA5B8"><div class="pcard__top"><span class="chip">' + S.icon('chat') + '</span></div>' +
          '<h3 style="font-size:28px">' + P.totalPrompts() + '</h3><p>Prompts sent</p></div></div>' +
      '<div class="btn-row"><a class="btn btn--primary" href="/bonus">See what opened &rarr;</a>' +
      '<a class="btn btn--ghost" href="/library">The Library</a></div>');
    return;
  }

  var head = n === 1
    ? { e: 'Day One &middot; Complete', t: 'Your system is live.',
        l: 'You don’t need to change your entire life today. Start by keeping the promises you make to yourself — that is tomorrow.' }
    : { e: S.esc(d.eyebrow) + ' &middot; Complete', t: S.esc(d.title) + ' is in.',
        l: S.doneCount() + ' of 7 done.' };

  page.innerHTML = shell(
    '<div class="lhero"><span class="lhero__eyebrow">' + head.e + '</span>' +
    '<h2>' + head.t + '</h2><p class="lede">' + head.l + '</p>' +
    (n === 1 && S.app() ? '<a class="appurl" href="' + S.esc(S.app().url) + '" target="_blank" rel="noopener">' + S.esc(S.app().url) + '</a>' : '') +
    '</div>' +
    '<div class="gate" id="g"><div><b>Day ' + (n + 1) + ' · ' + S.esc(next.title) + '</b>' +
    '<span>' + next.parts.length + ' modules · about ' + next.minutes + ' minutes</span></div>' +
    '<span class="gate__t" id="t"></span></div>' +
    '<p class="hint" style="margin-top:18px;color:var(--faint);font-size:13px">Seven days is the point. ' +
    'You cannot cram a week of honest records into one evening — and the board only means something if the days are real.</p>');

  /* Live countdown to the next day, and swap in the button at zero. */
  S.tick(function () {
    var ms = S.openIn(n + 1), t = document.getElementById('t'), g = document.getElementById('g');
    if (!t || !g) return;
    if (ms <= 0) {
      g.innerHTML = '<div><b>Day ' + (n + 1) + ' is open</b><span>' + S.esc(next.summary) + '</span></div>' +
        '<a class="btn btn--primary" style="margin-left:auto" href="/phase?p=seven&l=d' + (n + 1) + '">Start &rarr;</a>';
      return;
    }
    t.textContent = S.shortLeft(ms);
  });
})();
</script></body></html>
